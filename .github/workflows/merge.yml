name: Merge M3U Playlists

on:
  schedule:
    - cron: '30 6 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Merge Script
      run: |
        python -c '
        import urllib.request

        # Paster your actual M3U links inside the brackets below, separated by commas
        urls = [
            "https://modsmz.github.io/ch/sports.m3u",
            "https://raw.githubusercontent.com/Ajayone8x/sportzx-playlist/refs/heads/main/Sportzx.m3u8"
        ]

        with open("combined.m3u", "w", encoding="utf-8") as outfile:
            outfile.write("#EXTM3U\n")
            for url in urls:
                try:
                    req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                    with urllib.request.urlopen(req) as response:
                        lines = response.read().decode("utf-8").splitlines()
                        for line in lines:
                            if line.strip() == "#EXTM3U" or line.strip() == "":
                                continue
                            outfile.write(line + "\n")
                except Exception as e:
                    print(f"Error reading {url}: {e}")
        '

    - name: Commit and Push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add combined.m3u
        git commit -m "Automated M3U Playlist Update" || exit 0
        git push
